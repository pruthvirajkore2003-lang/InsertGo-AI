[package]
name = "insertgo"
version = "0.1.0"
description = "InsertGo — floating, always-on-top AI prompt assistant."
authors = ["InsertGo"]
edition = "2021"
# 1.85 required by enigo 0.6 (paste-chord synthesis).
rust-version = "1.85"

# The library is what the Tauri mobile/desktop entrypoints call into; keeping
# the app logic in a lib makes it unit-testable without the binary.
[lib]
name = "insertgo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = "2"
tauri-plugin-log = "2"
# System-browser launch for the PKCE sign-in flow.
tauri-plugin-opener = "2"
# `insertgo://auth/callback` hand-back from the browser (RFC 8252 native-app
# redirect). On Windows the OS starts a NEW process for the URL, so
# single-instance (with its `deep-link` feature) is what forwards it to the
# running app as an open-url event — the two plugins are a pair, not optional.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
# Managed session-token storage (domain/session_store.rs): OS credential store,
# ONE credential. The platform backend is a feature — enabled per-target below,
# so non-Windows targets still compile (featureless keyring has no backend and
# errors at runtime, which never happens on the shipped Windows target).
keyring = "3"

# Injection pipeline deps (SPEC §4.1, §7): only compiled on Windows — all call
# sites are `#[cfg(target_os = "windows")]`, so other targets build dep-free.
[target.'cfg(target_os = "windows")'.dependencies]
# Windows Credential Manager backend for the session-token keyring.
keyring = { version = "3", features = ["windows-native"] }
# Ctrl+V chord synthesis (SendInput wrapper). MSRV 1.85.
enigo = "0.6"
# Selected-text read (TextPattern) for the skill bar. Pinned to 0.22 — the
# last line targeting `windows ^0.61`, so it unifies with enigo and the
# `windows` dep below into a single copy (0.23+ jumps to windows 0.62).
# `event` stays OFF: windows-rs UIA event registration for array-typed
# properties corrupts the heap (windows-rs #3818); all reads are synchronous.
uiautomation = { version = "0.22", default-features = false, features = [
    "pattern",
    "control",
] }
# Foreground-window capture/restore + process/title lookup. Pinned to 0.61 so
# it unifies with enigo's `windows ^0.61` and cargo builds a single copy.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Read registry for MachineGuid
winreg = "0.52"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[features]
# Default Tauri custom-protocol used in release builds.
custom-protocol = ["tauri/custom-protocol"]
